<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FAME CAFÉ">
  <!-- Markenzeichen: der Half/Half-Kreis der Startseite.
       Links Coffee, rechts Matcha, dazwischen die Mittelachse. -->
  <rect width="64" height="64" rx="14" fill="#171412"/>
  <clipPath id="c"><circle cx="32" cy="32" r="20"/></clipPath>
  <g clip-path="url(#c)">
    <rect x="12" y="12" width="20" height="40" fill="#7A5037"/>
    <rect x="32" y="12" width="20" height="40" fill="#89A86B"/>
  </g>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#F6F3EC" stroke-width="2.5"/>
  <line x1="32" y1="9" x2="32" y2="55" stroke="#F6F3EC" stroke-width="2.5"/>
</svg>
