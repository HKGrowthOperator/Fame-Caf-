# FAME CAFÉ — nginx-Konfiguration für den Coolify-Build.
#
# Diese Datei wird nach /etc/nginx/conf.d/default.conf kopiert und damit im
# http-Kontext eingebunden — deshalb darf hier ein map-Block stehen.
#
# Warum map und nicht add_header je location: In nginx ersetzt ein add_header
# in einem location-Block ALLE geerbten add_header-Direktiven der übergeordneten
# Ebene. Wer Cache-Control je Dateityp in eigenen location-Blöcken setzt,
# verliert dort still die Sicherheits-Header. Über die map liegt jeder Header
# auf genau einer Ebene, und das Problem entsteht gar nicht erst.

map $uri $fame_cache_control {
    # Standard: HTML, health.txt und alles Unbekannte ungecacht, damit ein
    # Redeploy sofort sichtbar ist.
    default                                             "no-store, no-cache, must-revalidate, max-age=0";

    # CSS und JS tragen im Markup einen Versionsparameter (?v=…).
    # Vorher stand hier no-store: Die Seite hat bei jedem Aufruf alles neu geladen.
    "~*\.(?:css|js)$"                                   "public, max-age=3600";

    # Schriften haben feste Dateinamen und ändern sich nicht.
    "~*\.(?:woff2?)$"                                   "public, max-age=31536000, immutable";

    "~*\.(?:svg|png|jpg|jpeg|webp|avif|gif|ico)$"       "public, max-age=604800";
    "~*\.webmanifest$"                                  "public, max-age=604800";
}

# Verwaltung und API gehören nicht in Suchmaschinen. Als map gelöst (statt
# add_header je location), aus demselben Grund wie oben: ein add_header in einer
# location würde die Sicherheits-Header der Serverebene verdrängen.
map $uri $fame_robots {
    default                 "";
    "~^/(?:admin|api|bestellen)(?:/|$)" "noindex, nofollow, noarchive";
}

server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hinter Coolify/Traefik kennt nginx nur seinen internen Port 3000. Ohne das schriebe er ihn in
    # jede Verzeichnis-Weiterleitung (/bestellen → /bestellen/) und der Browser landete auf :3000.
    absolute_redirect off;

    # Kein SPA-Fallback mehr. Die frühere Regel try_files $uri $uri/ /index.html
    # hat jede unbekannte Adresse mit der Startseite und Status 200 beantwortet.
    # Auf einer statischen Seite heißt das: beliebig viele Adressen liefern
    # denselben Inhalt, und Suchmaschinen indexieren sie alle.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    location = /health.txt {
        default_type text/plain;
    }

    # Reservierungsdienst (server/index.mjs). Er lauscht nur auf 127.0.0.1 und
    # ist von außen ausschließlich über diese Adresse erreichbar.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 20s;
        proxy_connect_timeout 3s;
        client_max_body_size 16k;
        # Cache-Control kommt aus der map (Serverebene); sonst stünde es doppelt da.
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;
        # Fällt der Dienst aus, soll die Seite eine klare Antwort bekommen (JSON),
        # keine HTML-Fehlerseite — reservierung.js zeigt dann den Instagram-Ersatz.
        # error_page greift für Fehler, die nginx selbst erzeugt (Dienst nicht
        # erreichbar: 502, Zeitüberschreitung: 504). Eigene Antworten des Dienstes
        # gehen unverändert durch (proxy_intercept_errors off) — sonst sähe das
        # Personal statt „FAME_ADMIN_TOKEN fehlt“ nur „nicht erreichbar“.
        proxy_intercept_errors off;
        error_page 502 504 = @api_down;
    }
    location @api_down {
        internal;
        default_type application/json;
        return 503 '{"error":"unavailable","message":"Das Reservierungssystem ist gerade nicht erreichbar."}';
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header Cache-Control $fame_cache_control always;
    add_header X-Robots-Tag $fame_robots always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;
}
